<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲幸运大博饼🎲</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 20px; }
    .dice { width: 60px; height: 60px; margin: 3px; }
    .player { margin-bottom: 15px; }
    #gameArea { max-height: 400px; overflow-y: auto; margin-top: 20px; }
    input { padding: 5px; font-size: 14px; }
    button { padding: 5px 10px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🎲幸运大博饼🎲</h1>

  <div>
    昵称：<input type="text" id="nameInput" placeholder="输入昵称">
    <button id="joinBtn">加入游戏</button>
  </div>

  <div id="gameArea"></div>

  <script>
    const socket = new WebSocket(
      (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host
    );

    let myPlayerId = null;
    let myPlayerName = null;
    const gameArea = document.getElementById('gameArea');
    const nameInput = document.getElementById('nameInput');
    const joinBtn = document.getElementById('joinBtn');

    joinBtn.onclick = () => {
      const name = nameInput.value.trim() || null;
      socket.send(JSON.stringify({ type: 'setName', name: name }));
      nameInput.disabled = true;
      joinBtn.disabled = true;
    };

    socket.onopen = () => {
      console.log("✅ 已连接服务器");
    };

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'welcome') {
        myPlayerId = data.player;
        console.log("我是玩家", myPlayerId);
      }

      if (data.type === 'existingPlayers') {
        data.players.forEach(p => createPlayerUI(p.id, p.name));
        scrollGameAreaToBottom();
      }

      if (data.type === 'playerJoined') {
        createPlayerUI(data.player.id, data.player.name);
        scrollGameAreaToBottom();
      }

      if (data.type === 'playerLeft') {
        removePlayerUI(data.player);
      }

      if (data.type === 'roll') {
        rollDiceForPlayer(data.player, data.results);
      }

      if (data.type === 'nameConfirmed') {
        myPlayerName = data.name;
        createPlayerUI(myPlayerId, myPlayerName);
        scrollGameAreaToBottom();
      }
    };

    function createPlayerUI(playerId, name) {
      if (document.getElementById(`player${playerId}`)) return;

      let playerDiv = document.createElement('div');
      playerDiv.className = 'player';
      playerDiv.id = `player${playerId}`;

      let playerTitle = document.createElement('h2');
      playerTitle.textContent = name ? name : `玩家 ${playerId}`;
      playerDiv.appendChild(playerTitle);

      for (let j = 1; j <= 6; j++) {
        let diceImg = document.createElement('img');
        diceImg.className = 'dice';
        diceImg.id = `player${playerId}_dice${j}`;
        diceImg.src = 'dice1.png';
        playerDiv.appendChild(diceImg);
      }

      if (playerId === myPlayerId && !document.getElementById(`player${playerId}_rollBtn`)) {
        let rollButton = document.createElement('button');
        rollButton.id = `player${playerId}_rollBtn`;
        rollButton.textContent = "掷骰子";
        rollButton.onclick = function() {
          socket.send(JSON.stringify({ type: 'roll', player: myPlayerId }));
        };
        playerDiv.appendChild(rollButton);
      }

      gameArea.appendChild(playerDiv);
    }

    function removePlayerUI(playerId) {
      let el = document.getElementById(`player${playerId}`);
      if (el) el.remove();
    }

    function rollDiceForPlayer(playerNumber, results) {
      for (let i = 0; i < 6; i++) {
        document.getElementById(`player${playerNumber}_dice${i + 1}`).src = `dice${results[i]}.png`;
      }
    }

    function scrollGameAreaToBottom() {
      gameArea.scrollTop = gameArea.scrollHeight;
    }
  </script>
  <img  src="../WechatIMG23.jpg" alt="结算表" width=400>
</body>
</html>
