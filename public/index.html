<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人掷骰子游戏</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 20px; }
    .dice { width: 60px; height: 60px; margin: 3px; }
    .player { margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>🎲 多人掷骰子游戏</h1>
  <div id="gameArea"></div>

  <script>
    const socket = new WebSocket(
      (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host
    );

    let myPlayerId = null;
    const gameArea = document.getElementById('gameArea');

    socket.onopen = () => {
      console.log("✅ 已连接服务器");
    };

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'welcome') {
        myPlayerId = data.player;
        console.log("我是玩家", myPlayerId);
        createPlayerUI(myPlayerId);
      }

      if (data.type === 'playerJoined') {
        if (data.player !== myPlayerId) {
          createPlayerUI(data.player);
        }
      }

      if (data.type === 'playerLeft') {
        removePlayerUI(data.player);
      }

      if (data.type === 'roll') {
        rollDiceForPlayer(data.player, data.results);
      }
    };

    function createPlayerUI(playerId) {
      if (document.getElementById(`player${playerId}`)) return;

      let playerDiv = document.createElement('div');
      playerDiv.className = 'player';
      playerDiv.id = `player${playerId}`;

      let playerTitle = document.createElement('h2');
      playerTitle.textContent = `玩家 ${playerId}`;
      playerDiv.appendChild(playerTitle);

      for (let j = 1; j <= 6; j++) {
        let diceImg = document.createElement('img');
        diceImg.className = 'dice';
        diceImg.id = `player${playerId}_dice${j}`;
        diceImg.src = 'dice1.png';
        playerDiv.appendChild(diceImg);
      }

      if (playerId === myPlayerId) {
        let rollButton = document.createElement('button');
        rollButton.textContent = "掷骰子";
        rollButton.onclick = function() {
          socket.send(JSON.stringify({ type: 'roll', player: myPlayerId }));
        };
        playerDiv.appendChild(rollButton);
      }

      gameArea.appendChild(playerDiv);
    }

    function removePlayerUI(playerId) {
      let el = document.getElementById(`player${playerId}`);
      if (el) el.remove();
    }

    function rollDiceForPlayer(playerNumber, results) {
      for (let i = 0; i < 6; i++) {
        document.getElementById(`player${playerNumber}_dice${i + 1}`).src = `dice${results[i]}.png`;
      }
    }
  </script>
</body>
</html>
